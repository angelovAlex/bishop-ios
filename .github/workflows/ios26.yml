# Build Bishop for the iPhone with the iOS 26 SDK on GitHub's macOS 26 runner.
#
# This file lives INSIDE the published app tree on purpose. It used to sit at the
# repo root while the app was published from main/native/Bishop, and the two views
# of the same repo see each other's commits - so every root commit here made the
# next `git subtree push` a non-fast-forward. Keeping one tree means the subtree
# push is always clean. Edit it here, never in the published repo.
#
# WHY ANY OF THIS EXISTS: Alex's Mac is on macOS 14.7.2 / Xcode 16.2, which ships
# the iOS 18.2 SDK. Xcode 26 needs macOS 15.6+, so locally the app can never be
# built against iOS 26 - and a binary built against 18.2 keeps the legacy
# (pre-Liquid-Glass) appearance even when it runs on iOS 26. GitHub's `macos-26`
# image carries Xcode 26.x with the iOS SDK 26.x, so the build happens there.
#
# A runner has no USB, so the artifact reaches the phone through the Mac:
#   xcrun devicectl device install app --device <udid> ./Bishop.app
# (devicectl ships with Xcode 15 and does not care which SDK built the bundle.)
#
# SECRETS - this repo is public, so nothing about Alex's setup may be committed:
#   BUILD_CERT_P12   (optional) base64 of an Apple Development identity as .p12
#   BUILD_CERT_PASS  (optional) the password given to Keychain Access at export
#   ASC_KEY_ID       App Store Connect API key id      (Users and Access -> Integrations)
#   ASC_ISSUER_ID    its issuer id
#   ASC_KEY_P8       the downloaded AuthKey_XXXXX.p8, either pasted as-is
#                    or base64 encoded (encoded is safer for a messy paste)
#   BISHOP_TOKEN     the webui token, so it is baked into Info.plist
# With the API key, xcodebuild refreshes the provisioning profile itself; the
# Apple Development cert alone would also do, but the key cannot expire mid-run.

name: iOS 26 build

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "project.yml"
      - ".github/workflows/ios26.yml"

env:
  SCHEME: Bishop
  BUNDLE_ID: com.alex.Bishop
  # The Mac's address on the LAN. Follows this repo's convention of not being a
  # secret: only the token is.
  BISHOP_HOST: 192.168.2.12:8420
  KEYCHAIN_PASS: bishop-ci

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain (proves we really got SDK 26)
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Pick the newest Xcode 26.x
        run: |
          # The image ships several; its default is not always the newest.
          newest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Import the signing identity into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          CERT_PASS: ${{ secrets.BUILD_CERT_PASS }}
        run: |
          # Optional. With the App Store Connect API key below, xcodebuild can
          # fetch or create the development identity itself, so this is only for
          # pinning a specific certificate. Skipping it is fine.
          if [ -z "$CERT_P12" ]; then
            echo "BUILD_CERT_P12 is empty, leaving it to the API key"
            exit 0
          fi
          # A runner starts with no identity, and codesign cannot answer a
          # password prompt, so the cert goes into an unlocked temporary keychain.
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning


      - name: Write the App Store Connect API key
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # ASC_KEY_P8 is accepted in either form: the downloaded AuthKey_*.p8
          # pasted as-is (it is already a PEM, base64 inside BEGIN/END lines) or
          # that same file base64 encoded - the encoded form is just a one-liner
          # that survives a careless paste. Either way the result must be the
          # whole file: without the BEGIN/END armor xcodebuild rejects it.
          case "$KEY_P8" in
            "-----BEGIN"*) printf '%s\n' "$KEY_P8" > /tmp/asc.p8 ;;
            *) echo "$KEY_P8" | base64 --decode > /tmp/asc.p8 ;;
          esac
          grep -q "BEGIN PRIVATE KEY" /tmp/asc.p8 || {
            echo "ASC_KEY_P8 is neither a PEM nor its base64"; exit 1; }
          echo "ASC_KEY_PATH=/tmp/asc.p8" >> "$GITHUB_ENV"
          # xcodebuild also looks for the key under its own id.
          mkdir -p ~/private_keys && cp /tmp/asc.p8 ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Regenerate the Xcode project
        run: |
          # project.yml is the source of truth; the .xcodeproj is generated.
          brew install xcodegen || true
          xcodegen generate

      # Before spending the signed archive on Apple's certificate quota: does
      # the code even COMPILE against the iOS 26 SDK? Signing is off here, so
      # this step cannot fail for a certificate reason, which is what tells the
      # two apart - "Choose a certificate to revoke" used to hide the compile
      # result entirely, so a real error in Sources/ was indistinguishable from
      # an account problem.
      - name: Compile against the iOS 26 SDK (no signing, no quota)
        run: |
          xcodebuild -project Bishop.xcodeproj -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/compile-check \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build | tail -40
          echo "compiles clean against $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Build and sign
        env:
          TOKEN: ${{ secrets.BISHOP_TOKEN }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # PRODUCT_BUNDLE_IDENTIFIER is set here rather than relying on the
          # generated project, so the workspace owner can point the build at a
          # different app id without editing anything.
          xcodebuild -project Bishop.xcodeproj -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Bishop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            BISHOP_TOKEN="$TOKEN" BISHOP_HOST="$BISHOP_HOST" \
            archive

      - name: Check what the binary was actually built against
        run: |
          APP="build/Bishop.xcarchive/Products/Applications/Bishop.app"
          cp -R "$APP" ./Bishop.app
          # Look for "sdk 26.x" below. An 18.x would mean the SDK was not picked
          # up and the whole exercise was pointless.
          xcrun vtool -show-build ./Bishop.app/Bishop | grep -A3 'platform IOS' || true

      - uses: actions/upload-artifact@v4
        with:
          name: Bishop.app
          path: Bishop.app
          if-no-files-found: error
