# Build Bishop for the iPhone with the iOS 26 SDK on GitHub's macOS 26 runner.
#
# This file lives INSIDE the published app tree on purpose. It used to sit at the
# repo root while the app was published from main/native/Bishop, and the two views
# of the same repo see each other's commits - so every root commit here made the
# next `git subtree push` a non-fast-forward. Keeping one tree means the subtree
# push is always clean. Edit it here, never in the published repo.
#
# WHY ANY OF THIS EXISTS: Alex's Mac is on macOS 14.7.2 / Xcode 16.2, which ships
# the iOS 18.2 SDK. Xcode 26 needs macOS 15.6+, so locally the app can never be
# built against iOS 26 - and a binary built against 18.2 keeps the legacy
# (pre-Liquid-Glass) appearance even when it runs on iOS 26. GitHub's `macos-26`
# image carries Xcode 26.x with the iOS SDK 26.x, so the BUILD happens there.
#
# THE BUILD IS UNSIGNED, ON PURPOSE. This used to run a signed archive with
# -allowProvisioningUpdates and the App Store Connect API key, and Apple answers
# that by minting a fresh Apple Development certificate on every run (the CI is a
# different machine each time, so it never presents the one made last time).
# A paid account holds only three development certs, so after a few runs the
# archive died with "Choose a certificate to revoke. Your account has reached the
# maximum number of certificates" - which had nothing to do with the code and hid
# real compile errors. So the split is now:
#   CI   - compile + archive with CODE_SIGNING_ALLOWED=NO, upload the .app
#   Mac  - install_ios_app() drops the .app, embeds a provisioning profile, signs
#          it with the identity already in Alex's keychain, then installs it.
# Same signature as a local Xcode build, and no certificate is ever created.
#
# A runner has no USB, so the artifact reaches the phone through the Mac:
#   xcrun devicectl device install app --device <udid> ./Bishop.app
# (devicectl ships with Xcode 15 and does not care which SDK built the bundle.)
#
# SECRETS - this repo is public, so nothing about Alex's setup may be committed:
#   BISHOP_TOKEN     the webui token, so it is baked into Info.plist
# No certificate or App Store Connect key is needed any more; the ASC_* secrets
# are leftovers from the signed-archive era and can be deleted.

name: iOS 26 build

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "project.yml"
      - ".github/workflows/ios26.yml"

env:
  SCHEME: Bishop
  BUNDLE_ID: com.alex.Bishop
  # The Mac's address on the LAN. Follows this repo's convention of not being a
  # secret: only the token is.
  BISHOP_HOST: 192.168.2.12:8420

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain (proves we really got SDK 26)
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Pick the newest Xcode 26.x
        run: |
          # The image ships several; its default is not always the newest.
          newest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Regenerate the Xcode project
        run: |
          # project.yml is the source of truth; the .xcodeproj is generated.
          brew install xcodegen || true
          xcodegen generate

      - name: Compile against the iOS 26 SDK
        run: |
          xcodebuild -project Bishop.xcodeproj -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/compile-check \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build | tail -40
          echo "compiles clean against $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Archive, unsigned
        env:
          TOKEN: ${{ secrets.BISHOP_TOKEN }}
        run: |
          # PRODUCT_BUNDLE_IDENTIFIER is set here rather than relying on the
          # generated project, so the workspace owner can point the build at a
          # different app id without editing anything.
          #
          # CODE_SIGNING_ALLOWED=NO keeps xcodebuild away from the developer
          # portal: no profile is requested, no certificate is created, and the
          # three-cert account limit cannot be hit. The Mac signs the result.
          xcodebuild -project Bishop.xcodeproj -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Bishop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            BISHOP_TOKEN="$TOKEN" BISHOP_HOST="$BISHOP_HOST" \
            archive

      - name: Stage the bundle and check what it was built against
        run: |
          APP="build/Bishop.xcarchive/Products/Applications/Bishop.app"
          cp -R "$APP" ./Bishop.app
          # The unsigned archive has no embedded profile; the Mac puts its own in.
          test ! -e ./Bishop.app/embedded.mobileprovision
          ls -l ./Bishop.app/Bishop
          # Look for "sdk 26.x" below. An 18.x would mean the SDK was not picked
          # up and the whole exercise was pointless.
          xcrun vtool -show-build ./Bishop.app/Bishop | grep -A3 'platform IOS' || true

      - uses: actions/upload-artifact@v4
        with:
          name: Bishop.app
          path: Bishop.app
          if-no-files-found: error
