name: Bishop
options:
  bundleIdPrefix: com.alex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode: no strict-concurrency noise
    CODE_SIGNING_ALLOWED: "NO"    # simulator builds without a team
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Bishop:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bishop
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Mac speaks plain HTTP on the LAN, and its name is bishop.local.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Bishop talks to your Mac on the local network.
        NSBonjourServices: ["_http._tcp"]
